global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
