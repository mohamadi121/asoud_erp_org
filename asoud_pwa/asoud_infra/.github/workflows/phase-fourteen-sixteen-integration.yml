name: Phases Fourteen Through Sixteen Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          path: workspace/asoud_infra
      - name: Checkout ASOUD Core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/asoud_core
          token: ${{ secrets.ASOUD_REPOS_TOKEN }}
          path: workspace/asoud_core
      - name: Checkout ASOUD Iran
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/asoud_iran
          token: ${{ secrets.ASOUD_REPOS_TOKEN }}
          path: workspace/asoud_iran
      - name: Checkout ASOUD PWA
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/asoud_pwa
          token: ${{ secrets.ASOUD_REPOS_TOKEN }}
          path: workspace/asoud_pwa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          cache: true
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "workspace/asoud_core[dev]"
          python -m pip install -e "workspace/asoud_iran[dev]"
      - name: Configure ephemeral environment
        shell: pwsh
        working-directory: workspace/asoud_infra
        run: |
          Copy-Item .env.example .env
          $content = Get-Content .env -Raw
          $content = $content.Replace('change-me-root', [guid]::NewGuid().ToString('N'))
          $content = $content.Replace('change-me-admin', [guid]::NewGuid().ToString('N'))
          Set-Content .env $content
      - name: Bootstrap ERPNext v15
        shell: pwsh
        working-directory: workspace/asoud_infra
        run: ./scripts/bootstrap.ps1
      - name: Run complete phases 1-16 regression
        shell: pwsh
        working-directory: workspace/asoud_infra
        run: ./scripts/phase-fourteen-sixteen-gate.ps1 -ReuseFlutterPackages
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-fourteen-sixteen-readiness
          path: |
            workspace/asoud_infra/artifacts/phase-ten-thirteen-technical-readiness.json
            workspace/asoud_infra/artifacts/phase-fourteen-sixteen-readiness.json
      - name: Capture container logs on failure
        if: failure()
        working-directory: workspace/asoud_infra
        run: docker compose logs --no-color --tail 500
