<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900">
<style>.t{font-family:Tahoma,Arial}.h{font-size:22px;font-weight:700}.l{font-size:14px}.m{fill:#64748b}.f{fill:#fff;stroke:#dbe3ef}.b{fill:#2563eb}</style>
<rect width="1440" height="900" fill="#f4f7fb"/><rect width="1440" height="138" fill="#fff"/><text x="1380" y="42" text-anchor="end" class="t h">آسود ERP</text><text x="1220" y="40" text-anchor="end" class="t l m">تنظیمات مالی › نمودار حساب‌ها</text><text x="1380" y="105" text-anchor="end" class="t h">ویرایش حساب و قواعد تفصیلی</text>
<rect x="55" y="170" width="800" height="650" rx="14" fill="#fff"/><text x="815" y="215" text-anchor="end" class="t h">قواعد حساب ۱۲۰۱۰۱ — دریافتنی تجاری</text><rect x="82" y="250" width="745" height="95" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="790" y="284" text-anchor="end" class="t l" font-weight="700">مشتری • اجباری</text><text x="790" y="313" text-anchor="end" class="t l m">معتبر از ۱۴۰۵/۰۱/۰۱ • بدون تاریخ پایان</text>
<rect width="1440" height="900" fill="#0f172a" opacity=".22"/><rect x="860" width="580" height="900" fill="#fff"/><text x="1400" y="52" text-anchor="end" class="t h">ایجاد قاعده اتصال حساب و تفصیلی</text><text x="1400" y="78" text-anchor="end" class="t l m">قاعده هنگام ثبت سند دوباره در Backend کنترل می‌شود.</text><line x1="880" y1="100" x2="1420" y2="100" stroke="#e2e8f0"/>
<text x="1400" y="140" text-anchor="end" class="t l m">حساب سندپذیر</text><rect x="900" y="153" width="500" height="48" rx="8" fill="#f8fafc" stroke="#dbe3ef"/><text x="1375" y="183" text-anchor="end" class="t l">۱۲۰۱۰۱ — دریافتنی تجاری</text>
<text x="1400" y="230" text-anchor="end" class="t l m">نوع تفصیلی مجاز *</text><rect x="900" y="243" width="500" height="48" rx="8" class="f"/><text x="1375" y="273" text-anchor="end" class="t l">مشتری⌄</text>
<rect x="1352" y="325" width="48" height="26" rx="13" class="b"/><circle cx="1386" cy="338" r="10" fill="#fff"/><text x="1335" y="344" text-anchor="end" class="t l">قاعده فعال باشد</text><rect x="1352" y="375" width="48" height="26" rx="13" class="b"/><circle cx="1386" cy="388" r="10" fill="#fff"/><text x="1335" y="394" text-anchor="end" class="t l">انتخاب تفصیلی اجباری باشد</text>
