<text x="1400" y="545" text-anchor="end" class="t l m">بازه اعتبار قاعده</text><rect x="1155" y="558" width="245" height="48" rx="8" class="f"/><text x="1375" y="588" text-anchor="end" class="t l m">معتبر از</text><rect x="900" y="558" width="235" height="48" rx="8" class="f"/><text x="1110" y="588" text-anchor="end" class="t l m">معتبر تا</text>
<rect x="900" y="640" width="500" height="76" rx="10" fill="#eff6ff"/><text x="1375" y="672" text-anchor="end" class="t l" fill="#1d4ed8">فقط یک نوع تفصیلی می‌تواند برای این حساب اجباری باشد.</text><text x="1375" y="698" text-anchor="end" class="t l m">تغییرات همراه با ذخیره حساب نهایی می‌شوند.</text>
