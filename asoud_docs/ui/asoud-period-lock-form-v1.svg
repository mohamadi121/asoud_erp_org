  <rect x="935" y="596" width="393" height="43" rx="8" class="field"/>
  <text x="1304" y="623" text-anchor="end" class="t l">۱۴۰۶/۰۱/۳۱</text>

  <rect x="490" y="649" width="1310" height="157" rx="10" class="soft"/>
  <text x="1768" y="683" text-anchor="end" class="t h3">۲. دلیل و کنترل نهایی</text>
  <text x="1768" y="716" text-anchor="end" class="t l muted">دلیل قفل *</text>
  <rect x="935" y="728" width="833" height="51" rx="8" class="field"/>
  <text x="1744" y="759" text-anchor="end" class="t l">نهایی‌سازی اسناد فروردین و تهیه گزارش مدیریت</text>
