<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"><style>.t{font-family:Tahoma,Arial}.h{font-size:22px;font-weight:700}.l{font-size:14px}.m{fill:#64748b}.f{fill:#fff;stroke:#dbe3ef}.b{fill:#2563eb}</style><rect width="1440" height="900" fill="#f4f7fb"/><rect width="1440" height="130" fill="#fff"/><text x="1380" y="42" text-anchor="end" class="t h">آسود ERP</text><text x="1380" y="100" text-anchor="end" class="t h">تنظیمات مالی › قفل دوره</text><rect x="60" y="170" width="790" height="650" rx="14" fill="#fff"/><text x="815" y="215" text-anchor="end" class="t h">قفل‌های فعال</text><rect x="85" y="250" width="740" height="85" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="790" y="284" text-anchor="end" class="t l" font-weight="700">فروردین ۱۴۰۶ • قفل‌شده</text><text x="790" y="311" text-anchor="end" class="t l m">2027-03-21 تا 2027-04-20</text><rect width="1440" height="900" fill="#0f172a" opacity=".22"/><rect x="900" width="540" height="900" fill="#fff"/><text x="1400" y="52" text-anchor="end" class="t h">قفل دوره مالی</text><text x="1400" y="80" text-anchor="end" class="t l m">تمام اسناد بازه باید شماره قطعی داشته باشند.</text><line x1="920" y1="105" x2="1420" y2="105" stroke="#e2e8f0"/><text x="1400" y="150" text-anchor="end" class="t l m">دوره مالی</text><rect x="930" y="163" width="470" height="50" rx="8" class="f"/><text x="1375" y="194" text-anchor="end" class="t l">فروردین ۱۴۰۶⌄</text><text x="1400" y="250" text-anchor="end" class="t l m">سال مالی *</text><rect x="930" y="263" width="470" height="50" rx="8" fill="#f8fafc" stroke="#dbe3ef"/><text x="1375" y="294" text-anchor="end" class="t l">۱۴۰۶</text><text x="1400" y="350" text-anchor="end" class="t l m">بازه قفل *</text><rect x="1170" y="363" width="230" height="50" rx="8" fill="#f8fafc" stroke="#dbe3ef"/><text x="1375" y="394" text-anchor="end" class="t l">2027-03-21</text><rect x="930" y="363" width="220" height="50" rx="8" fill="#f8fafc" stroke="#dbe3ef"/><text x="1125" y="394" text-anchor="end" class="t l">2027-04-20</text><text x="1400" y="455" text-anchor="end" class="t l m">دلیل قفل *</text><rect x="930" y="468" width="470" height="100" rx="8" class="f"/><text x="1375" y="500" text-anchor="end" class="t l">نهایی‌سازی اسناد فروردین و تهیه گزارش مدیریت</text><rect x="930" y="610" width="470" height="78" rx="10" fill="#fff8e8"/><text x="1375" y="643" text-anchor="end" class="t l" fill="#b54708">پس از قفل، ثبت، اصلاح و ابطال سند در این بازه ممنوع است.</text><text x="1375" y="670" text-anchor="end" class="t l m">عملیات در زنجیره حسابرسی ثبت می‌شود.</text><line x1="920" y1="820" x2="1420" y2="820" stroke="#e2e8f0"/><rect x="1220" y="840" width="180" height="44" rx="8" class="b"/><text x="1310" y="868" text-anchor="middle" class="t l" fill="#fff">تأیید و قفل دوره</text><rect x="1080" y="840" width="120" height="44" rx="8" class="f"/><text x="1140" y="868" text-anchor="middle" class="t l">انصراف</text></svg>
