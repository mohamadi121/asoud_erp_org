  <text x="388" y="670" text-anchor="end" class="t h3">کنترل مهم</text>
  <text x="388" y="704" text-anchor="end" class="t l muted">بعد از قفل، ثبت، اصلاح یا ابطال سند در این</text>
  <text x="388" y="729" text-anchor="end" class="t l muted">بازه ممنوع است. بازگشایی فقط با مجوز و</text>
  <text x="388" y="754" text-anchor="end" class="t l muted">ثبت دلیل مستقل انجام می‌شود.</text>

