  <circle cx="862" cy="750" r="11" fill="#1d9b57"/>
  <path d="M856 750l4 4 8-10" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="838" y="746" text-anchor="end" class="t h3" fill="#137344">کنترل اسناد انجام شد</text>
  <text x="838" y="769" text-anchor="end" class="t s muted">همه اسناد بازه دارای شماره قطعی هستند.</text>

  <rect x="490" y="826" width="1310" height="104" rx="10" fill="#fff7e8" stroke="#f4c977"/>
  <text x="1768" y="861" text-anchor="end" class="t h3" fill="#b54708">اثر عملیات</text>
  <text x="1768" y="890" text-anchor="end" class="t l muted">پس از تأیید، دوره برای ثبت، اصلاح و ابطال سند بسته می‌شود. بازگشایی شماره قطعی را حذف نمی‌کند.</text>

