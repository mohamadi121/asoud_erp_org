<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">صفحه کارتابل و گردش تأیید آسود ERP</title>
  <desc id="desc">طرح برداری RTL صفحه کارتابل در Flutter Web PWA شامل Ribbon، آمار، جست‌وجو، فیلتر، جدول درخواست‌ها، مسیر تأیید، تاریخچه و عملیات.</desc>
  <defs>
    <style>
      text{font-family:"Vazirmatn","Tahoma","Segoe UI",sans-serif;fill:#12213d}
      .bg{fill:#f5f7fb}.surface{fill:#fff}.soft{fill:#f8fafd}.blueSoft{fill:#edf3ff}.greenSoft{fill:#eaf8f1}.orangeSoft{fill:#fff5e5}.redSoft{fill:#fff0f0}
      .line{stroke:#dfe5ee;stroke-width:1}.card{fill:#fff;stroke:#dfe5ee;stroke-width:1.2}
      .primary{fill:#155bd7}.muted{fill:#68758a}.success{fill:#1c9b62}.warning{fill:#d98a10}.danger{fill:#d94b4b}
      .h1{font-size:22px;font-weight:900}.h2{font-size:17px;font-weight:800}.body{font-size:13px}.small{font-size:11px}.tiny{font-size:9px}
      .white{fill:#fff}.bold{font-weight:800}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#12213d" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" class="bg"/>

  <!-- MAIN NAVIGATION -->
  <g id="top-navigation">
    <rect width="1920" height="68" class="surface"/>
    <line x1="0" y1="67.5" x2="1920" y2="67.5" class="line"/>
    <rect x="1848" y="15" width="38" height="38" rx="9" class="primary"/>
    <path d="M1860 34l7-12 7 12-7 12z" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="1835" y="40" text-anchor="end" font-size="20" font-weight="900">آسود ERP</text>
    <text x="1642" y="40" text-anchor="middle" class="primary body bold">داشبورد</text>
    <text x="1535" y="40" text-anchor="middle" class="body">مالی</text>
    <text x="1420" y="40" text-anchor="middle" class="body">خزانه‌داری</text>
    <text x="1320" y="40" text-anchor="middle" class="body">فروش</text>
    <text x="1230" y="40" text-anchor="middle" class="body">خرید</text>
    <text x="1140" y="40" text-anchor="middle" class="body">انبار</text>
    <text x="1025" y="40" text-anchor="middle" class="body">منابع انسانی</text>
    <text x="900" y="40" text-anchor="middle" class="body">گزارش‌ها</text>
    <text x="790" y="40" text-anchor="middle" class="body">تنظیمات</text>
    <line x1="1600" y1="64" x2="1684" y2="64" stroke="#155bd7" stroke-width="4"/>
    <rect x="370" y="14" width="255" height="40" rx="8" class="soft" stroke="#dfe5ee"/>
    <text x="600" y="39" text-anchor="end" class="muted small">جست‌وجوی ماژول یا فرمان...</text><text x="390" y="40" class="primary">⌕</text>
    <text x="330" y="40" font-size="18">🔔</text><text x="280" y="40" font-size="18">؟</text>
    <circle cx="220" cy="34" r="19" class="blueSoft"/><text x="220" y="40" text-anchor="middle">👤</text>
    <text x="190" y="29" text-anchor="end" class="small bold">مدیر سیستم</text><text x="190" y="46" text-anchor="end" class="muted tiny">شرکت آسود — دفتر مرکزی</text>
    <text x="28" y="41" font-size="19">☰</text>
  </g>

  <!-- APPROVAL RIBBON -->
  <g id="approval-ribbon">
    <rect y="68" width="1920" height="112" class="soft"/>
    <line x1="0" y1="179.5" x2="1920" y2="179.5" class="line"/>
    <g transform="translate(1810 84)">
      <rect x="-60" y="0" width="82" height="70" rx="8" class="blueSoft"/>
      <text x="-19" y="25" text-anchor="middle" font-size="23" class="primary">▣</text><text x="-19" y="49" text-anchor="middle" class="primary small bold">در انتظار من</text>
      <text x="-115" y="25" text-anchor="middle" font-size="22">↗</text><text x="-115" y="49" text-anchor="middle" class="small">ارسالی‌ها</text>
      <text x="-205" y="25" text-anchor="middle" font-size="22">↻</text><text x="-205" y="49" text-anchor="middle" class="small">تاریخچه</text>
      <text x="-112" y="86" text-anchor="middle" class="muted tiny">کارتابل</text>
    </g>
    <line x1="1550" y1="80" x2="1550" y2="164" class="line"/>
    <g transform="translate(1470 84)">
      <text x="0" y="25" text-anchor="middle" font-size="22">⌘</text><text x="0" y="49" text-anchor="middle" class="small">سیاست‌ها</text>
      <text x="-100" y="25" text-anchor="middle" font-size="22">♟</text><text x="-100" y="49" text-anchor="middle" class="small">جانشینی</text>
      <text x="-50" y="86" text-anchor="middle" class="muted tiny">گردش تأیید</text>
    </g>
    <line x1="1310" y1="80" x2="1310" y2="164" class="line"/>
    <g transform="translate(1225 84)">
      <text x="0" y="25" text-anchor="middle" font-size="22">↻</text><text x="0" y="49" text-anchor="middle" class="small">به‌روزرسانی</text>
      <text x="-95" y="25" text-anchor="middle" font-size="22">＋</text><text x="-95" y="49" text-anchor="middle" class="small">ارسال سند</text>
      <text x="-47" y="86" text-anchor="middle" class="muted tiny">عملیات</text>
    </g>
    <line x1="1065" y1="80" x2="1065" y2="164" class="line"/>
    <rect x="790" y="93" width="250" height="38" rx="7" class="surface" stroke="#dfe5ee"/><text x="1018" y="117" text-anchor="end" class="small">🏢 شرکت آسود دمو</text>
    <rect x="590" y="93" width="185" height="38" rx="7" class="surface" stroke="#dfe5ee"/><text x="755" y="117" text-anchor="end" class="small">🏬 دفتر مرکزی</text>
    <text x="815" y="158" text-anchor="middle" class="muted tiny">زمینه دسترسی</text>
  </g>

  <!-- PAGE HEADER -->
  <g id="page-header">
    <rect y="180" width="1920" height="74" class="surface"/>
    <rect x="1840" y="196" width="42" height="42" rx="10" class="blueSoft"/><text x="1861" y="224" text-anchor="middle" font-size="21" class="primary">▣</text>
    <text x="1827" y="215" text-anchor="end" class="h1">کارتابل و گردش تأیید</text><text x="1827" y="237" text-anchor="end" class="muted small">شرکت آسود دمو — دفتر مرکزی</text>
    <rect x="92" y="196" width="175" height="42" rx="8" class="primary"/><text x="180" y="222" text-anchor="middle" class="white body bold">↗ ارسال سند برای تأیید</text>
    <rect x="280" y="196" width="42" height="42" rx="8" class="soft" stroke="#dfe5ee"/><text x="301" y="223" text-anchor="middle" font-size="18">↻</text>
  </g>

  <!-- VIEW NAVIGATION -->
  <g id="view-navigation">
    <rect y="254" width="1920" height="52" class="surface"/>
    <text x="1770" y="286" text-anchor="middle" class="primary body bold">▣ کارتابل من</text>
    <text x="1590" y="286" text-anchor="middle" class="body">↗ ارسالی‌ها</text>
    <text x="1435" y="286" text-anchor="middle" class="body">↻ تاریخچه</text>
    <text x="1260" y="286" text-anchor="middle" class="body">⌘ مسیرهای تأیید</text>
    <text x="1055" y="286" text-anchor="middle" class="body">♟ کاربران و دسترسی</text>
    <line x1="1695" y1="302" x2="1845" y2="302" stroke="#155bd7" stroke-width="3"/>
    <line x1="0" y1="305.5" x2="1920" y2="305.5" class="line"/>
  </g>

  <!-- FILTER TOOLBAR -->
  <g id="filter-toolbar">
    <rect y="306" width="1920" height="64" class="soft"/>
    <rect x="1440" y="318" width="420" height="40" rx="8" class="surface" stroke="#dfe5ee"/>
    <text x="1835" y="343" text-anchor="end" class="muted small">جست‌وجوی شماره، سند، درخواست‌کننده یا مسیر</text><text x="1462" y="344" class="primary">⌕</text>
    <rect x="1230" y="318" width="195" height="40" rx="8" class="surface" stroke="#dfe5ee"/><text x="1400" y="343" text-anchor="end" class="small">همه نوع اسناد⌄</text>
    <text x="80" y="343" class="muted small">درخواست‌های قابل اقدام برای کاربر جاری</text>
  </g>

  <!-- CONTENT -->
  <g id="approval-content">
    <!-- counters -->
    <g id="counter-cards">
      <rect x="1420" y="390" width="440" height="92" rx="10" class="card"/>
      <circle cx="1455" cy="425" r="20" class="orangeSoft"/><text x="1455" y="431" text-anchor="middle" class="warning">⏳</text>
      <text x="1825" y="420" text-anchor="end" class="muted small">در انتظار اقدام من</text><text x="1825" y="455" text-anchor="end" class="h1">۳</text>
      <rect x="965" y="390" width="440" height="92" rx="10" class="card"/>
      <circle cx="1000" cy="425" r="20" class="blueSoft"/><text x="1000" y="431" text-anchor="middle" class="primary">↗</text>
      <text x="1370" y="420" text-anchor="end" class="muted small">درخواست‌های باز من</text><text x="1370" y="455" text-anchor="end" class="h1">۷</text>
      <rect x="510" y="390" width="440" height="92" rx="10" class="card"/>
      <circle cx="545" cy="425" r="20" class="greenSoft"/><text x="545" y="431" text-anchor="middle" class="success">✓</text>
      <text x="915" y="420" text-anchor="end" class="muted small">سوابق نهایی‌شده من</text><text x="915" y="455" text-anchor="end" class="h1">۲۴</text>
    </g>

    <!-- TABLE -->
    <g id="inbox-table">
      <rect x="70" y="505" width="1260" height="525" rx="11" class="card"/>
      <rect x="86" y="521" width="1228" height="44" rx="6" class="soft"/>
      <g class="muted small">
        <text x="1275" y="548" text-anchor="end">نوع سند</text><text x="1085" y="548" text-anchor="end">شماره سند</text><text x="865" y="548" text-anchor="end">درخواست‌کننده</text>
        <text x="645" y="548" text-anchor="end">مبلغ</text><text x="450" y="548" text-anchor="end">مرحله</text><text x="245" y="548" text-anchor="end">وضعیت</text>
      </g>
      <rect x="86" y="578" width="1228" height="82" rx="7" class="blueSoft" stroke="#9ebeff"/>
      <g class="body">
        <text x="1275" y="611" text-anchor="end" class="bold">فاکتور فروش</text><text x="1085" y="611" text-anchor="end">SINV-00042</text><text x="865" y="611" text-anchor="end">سارا محمدی</text>
        <text x="645" y="611" text-anchor="end">۱۲۵٬۴۰۰٬۰۰۰ ریال</text><text x="450" y="611" text-anchor="end">۲ از ۳</text><text x="245" y="611" text-anchor="end" class="warning">● در انتظار</text>
        <text x="1275" y="639" text-anchor="end" class="muted small">مسیر تأیید فروش عمده</text><text x="115" y="625" class="primary">← مشاهده</text>
      </g>
      <line x1="86" y1="674" x2="1314" y2="674" class="line"/>
      <g class="body">
        <text x="1275" y="714" text-anchor="end" class="bold">دریافت / پرداخت</text><text x="1085" y="714" text-anchor="end">ACC-PAY-0030</text><text x="865" y="714" text-anchor="end">واحد خرید</text>
        <text x="645" y="714" text-anchor="end">۸۴٬۰۰۰٬۰۰۰ ریال</text><text x="450" y="714" text-anchor="end">۱ از ۲</text><text x="245" y="714" text-anchor="end" class="warning">● در انتظار</text>
      </g>
      <line x1="86" y1="752" x2="1314" y2="752" class="line"/>
      <g class="body">
        <text x="1275" y="792" text-anchor="end" class="bold">سند حسابداری</text><text x="1085" y="792" text-anchor="end">ACC-JV-0033</text><text x="865" y="792" text-anchor="end">حسابداری</text>
        <text x="645" y="792" text-anchor="end">۳۹٬۵۰۰٬۰۰۰ ریال</text><text x="450" y="792" text-anchor="end">۱ از ۳</text><text x="245" y="792" text-anchor="end" class="warning">● در انتظار</text>
      </g>
      <line x1="86" y1="830" x2="1314" y2="830" class="line"/>
      <g class="body">
        <text x="1275" y="870" text-anchor="end" class="bold">انتقال بین‌شرکتی</text><text x="1085" y="870" text-anchor="end">ICT-00018</text><text x="865" y="870" text-anchor="end">مدیر شعبه</text>
        <text x="645" y="870" text-anchor="end">۲۱۰٬۰۰۰٬۰۰۰ ریال</text><text x="450" y="870" text-anchor="end">۲ از ۴</text><text x="245" y="870" text-anchor="end" class="warning">● در انتظار</text>
      </g>
      <text x="1285" y="998" text-anchor="end" class="muted small">نمایش ۴ مورد از ۴ درخواست قابل اقدام</text><text x="105" y="998" class="muted small">۱ از ۱</text>
    </g>

    <!-- DETAIL PANE -->
    <g id="approval-detail-pane" filter="url(#shadow)">
      <rect x="1350" y="505" width="500" height="525" rx="11" class="surface" stroke="#dfe5ee"/>
      <rect x="1350" y="505" width="500" height="58" rx="11" class="surface"/><line x1="1350" y1="563" x2="1850" y2="563" class="line"/>
      <text x="1815" y="540" text-anchor="end" class="h2">▤ جزئیات درخواست APR-REQ-0042</text><text x="1380" y="540" font-size="18">×</text>
      <text x="1815" y="600" text-anchor="end" class="h2">فاکتور فروش — SINV-00042</text>
      <rect x="1380" y="580" width="82" height="28" rx="14" class="orangeSoft"/><text x="1421" y="599" text-anchor="middle" class="warning small bold">در انتظار</text>
      <g class="small">
        <text x="1815" y="637" text-anchor="end" class="muted">🏢 زمینه</text><text x="1670" y="637" text-anchor="end" class="bold">شرکت آسود / دفتر مرکزی</text>
        <text x="1815" y="666" text-anchor="end" class="muted">👤 درخواست‌کننده</text><text x="1670" y="666" text-anchor="end" class="bold">سارا محمدی</text>
        <text x="1815" y="695" text-anchor="end" class="muted">▣ مبلغ</text><text x="1670" y="695" text-anchor="end" class="bold">۱۲۵٬۴۰۰٬۰۰۰ ریال</text>
      </g>
      <line x1="1380" y1="718" x2="1820" y2="718" class="line"/>
      <text x="1815" y="748" text-anchor="end" class="body bold">مسیر تأیید</text>
      <rect x="1380" y="762" width="440" height="54" rx="8" class="greenSoft" stroke="#b9e3ce"/><circle cx="1790" cy="789" r="15" fill="#1c9b62"/><text x="1790" y="794" text-anchor="middle" class="white">✓</text><text x="1762" y="785" text-anchor="end" class="small bold">۱. مدیر شعبه</text><text x="1762" y="802" text-anchor="end" class="muted tiny">تأییدشده توسط مدیر دفتر مرکزی</text>
      <rect x="1380" y="824" width="440" height="54" rx="8" class="blueSoft" stroke="#9ebeff"/><circle cx="1790" cy="851" r="15" fill="#155bd7"/><text x="1790" y="856" text-anchor="middle" class="white">●</text><text x="1762" y="847" text-anchor="end" class="small bold">۲. مدیر مالی — مرحله جاری</text><text x="1762" y="864" text-anchor="end" class="muted tiny">در انتظار اقدام کاربر جاری</text>
      <rect x="1380" y="886" width="440" height="48" rx="8" class="soft" stroke="#dfe5ee"/><circle cx="1790" cy="910" r="15" fill="#dfe5ee"/><text x="1790" y="915" text-anchor="middle" class="muted">3</text><text x="1762" y="914" text-anchor="end" class="small bold">۳. مدیرعامل</text>
      <rect x="1350" y="952" width="500" height="78" class="soft"/><line x1="1350" y1="952" x2="1850" y2="952" class="line"/>
      <rect x="1668" y="971" width="152" height="42" rx="8" class="primary"/><text x="1744" y="997" text-anchor="middle" class="white body bold">✓ تأیید</text>
      <rect x="1608" y="971" width="46" height="42" rx="8" class="surface" stroke="#dfe5ee"/><text x="1631" y="998" text-anchor="middle">↩</text>
      <rect x="1548" y="971" width="46" height="42" rx="8" class="surface" stroke="#dfe5ee"/><text x="1571" y="998" text-anchor="middle" class="danger">×</text>
      <text x="1518" y="997" text-anchor="end" class="muted tiny">بازگشت / رد با علت اجباری</text>
    </g>
  </g>

  <text x="960" y="1062" text-anchor="middle" class="muted tiny">ASOUD ERP — Approval Inbox &amp; Workflow — Flutter Web PWA / RTL / BLoC / Frappe v15</text>
</svg>
