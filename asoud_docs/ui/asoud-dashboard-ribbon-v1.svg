<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">داشبورد مدیریتی آسود ERP با Ribbon دو سطحی</title>
  <desc id="desc">مرجع برداری رابط وب فارسی شامل منوی اصلی، Ribbon، شاخص‌ها، نمودارها، کارتابل، اعلان‌ها و دو کشوی دسترسی سریع و ایجاد پیش‌نویس.</desc>
