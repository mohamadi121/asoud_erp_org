<rect x="70" y="455" width="1780" height="430" rx="12" class="card"/><text x="1810" y="505" class="t dark" font-size="20" font-weight="800" text-anchor="end">تخصیص شماره قطعی برای بازه انتخابی</text><text x="1810" y="535" class="t muted" font-size="12" text-anchor="end">این عملیات رسمی، ثبت‌شونده در Audit و فقط در Company فعال اجرا می‌شود.</text>
<g class="t"><text x="1790" y="600" class="dark" font-size="12" text-anchor="end">سال مالی *</text><rect x="1430" y="615" width="360" height="48" rx="8" class="field"/><text x="1760" y="645" class="dark" font-size="14" text-anchor="end">۱۴۰۵</text><text x="1370" y="600" class="dark" font-size="12" text-anchor="end">از تاریخ *</text><rect x="1010" y="615" width="360" height="48" rx="8" class="field"/><text x="1340" y="645" class="dark" font-size="14" text-anchor="end">2026-03-21</text><text x="950" y="600" class="dark" font-size="12" text-anchor="end">تا تاریخ *</text><rect x="590" y="615" width="360" height="48" rx="8" class="field"/><text x="920" y="645" class="dark" font-size="14" text-anchor="end">2026-04-20</text><text x="1790" y="715" class="dark" font-size="12" text-anchor="end">دلیل اجرا *</text><rect x="590" y="730" width="1200" height="55" rx="8" class="field"/><text x="1760" y="763" class="muted" font-size="13" text-anchor="end">تخصیص شماره قطعی اسناد فروردین ۱۴۰۵</text><rect x="1360" y="815" width="430" height="48" rx="9" class="blue"/><text x="1575" y="846" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">مرتب‌سازی و تخصیص شماره قطعی</text></g>
<rect x="70" y="915" width="1780" height="90" rx="12" fill="#edf3ff"/><text x="1810" y="952" class="t dark" font-size="13" font-weight="700" text-anchor="end">کنترل سیستمی</text><text x="1810" y="980" class="t muted" font-size="12" text-anchor="end">اسناد قفل‌شده تغییر نمی‌کنند؛ شماره موقت پاک نمی‌شود؛ اجرای تکراری روی همان بازه idempotent است.</text>
