<rect x="970" y="405" width="880" height="555" rx="12" class="card"/><text x="1810" y="452" class="t dark" font-size="19" font-weight="800" text-anchor="end">تخصیص شماره قطعی</text><text x="1810" y="478" class="t muted" font-size="12" text-anchor="end">بازه معتبر از سال مالی انتخابی پیشنهاد و با تاریخ‌نگار کنترل می‌شود.</text>
