<rect x="100" y="605" width="800" height="43" fill="#f1f5fa"/><text x="870" y="632" class="dark" font-size="12" font-weight="700" text-anchor="end">انتخاب</text><text x="750" y="632" class="dark" font-size="12" font-weight="700" text-anchor="end">شماره موقت</text><text x="515" y="632" class="dark" font-size="12" font-weight="700" text-anchor="end">سند مبدأ</text><text x="190" y="632" class="dark" font-size="12" font-weight="700" text-anchor="end">تاریخ</text>
