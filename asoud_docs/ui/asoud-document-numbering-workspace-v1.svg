<rect x="70" y="405" width="870" height="555" rx="12" class="card"/><text x="900" y="452" class="t dark" font-size="19" font-weight="800" text-anchor="end">ادغام انتخابی اسناد روزانه</text><text x="900" y="478" class="t muted" font-size="12" text-anchor="end">فقط اسناد موقت همان Company و همان روز قابل انتخاب‌اند.</text>
