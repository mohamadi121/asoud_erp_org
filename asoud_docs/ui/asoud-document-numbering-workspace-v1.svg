<rect x="70" y="985" width="1780" height="55" rx="10" fill="#edf3ff"/><text x="1810" y="1019" class="t muted" font-size="12" text-anchor="end">هر ادغام یک سند واقعی، شماره‌دار و قابل لغو پیش از شماره‌گذاری است؛ اسناد عضو شماره قطعی مشترک می‌گیرند و شماره موقت خود را حفظ می‌کنند.</text>
