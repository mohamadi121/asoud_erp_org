<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<style>.t{font-family:Tahoma,"Segoe UI",sans-serif}.dark{fill:#0b1f44}.muted{fill:#64748b}.card{fill:#fff;stroke:#d8e1ed}.field{fill:#fff;stroke:#cbd7e6}.blue{fill:#155bd7}.canvas{fill:#f4f7fb}</style>
<rect width="1920" height="1080" class="canvas"/><rect width="1920" height="66" fill="#fff"/><path d="M0 65h1920" stroke="#d8e1ed"/>
<text x="1840" y="40" class="t dark" font-size="24" font-weight="800" text-anchor="end">آسود ERP</text><text x="1650" y="40" class="t dark" font-size="15" text-anchor="end">داشبورد</text><text x="1510" y="40" class="t dark" font-size="15" text-anchor="end">مالی</text><text x="1370" y="40" class="t blue" font-size="15" font-weight="700" text-anchor="end">تنظیمات</text>
<rect y="66" width="1920" height="116" fill="#f8faff"/><text x="1835" y="112" class="t blue" font-size="14" font-weight="700" text-anchor="end">شماره‌گذاری اسناد</text><text x="1655" y="112" class="t dark" font-size="14" text-anchor="end">تنظیمات ایران</text><text x="1470" y="112" class="t dark" font-size="14" text-anchor="end">اختتامیه و افتتاحیه</text>
<text x="1845" y="230" class="t dark" font-size="27" font-weight="900" text-anchor="end">شماره‌گذاری قانونی اسناد</text><text x="1845" y="260" class="t muted" font-size="13" text-anchor="end">مرتب‌سازی بر اساس تاریخ، تخصیص شماره قطعی و نگهداری دائمی شماره موقت</text>
