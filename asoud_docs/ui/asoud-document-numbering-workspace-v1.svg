<text x="1845" y="225" class="t dark" font-size="27" font-weight="900" text-anchor="end">شماره‌گذاری قانونی و ادغام روزانه</text><text x="1845" y="255" class="t muted" font-size="13" text-anchor="end">Company فعال: شرکت آسود • شماره موقت دائمی • عملیات رسمی و قابل حسابرسی</text>
