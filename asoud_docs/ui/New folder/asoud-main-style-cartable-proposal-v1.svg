<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">پیشنهاد استایل ثابت آسود ERP — صفحه کارتابل</title>
  <desc id="desc">طرح RTL صفحه کارتابل با حفظ کامل منوی اصلی و Ribbon داشبورد و تغییر صرفاً در محدوده محتوای صفحه.</desc>
  <defs>
