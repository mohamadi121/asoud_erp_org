[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "asoud_hr"
authors = [{name = "ASOUD", email = "engineering@asoud.local"}]
description = "Human resources, daily work reports and formal internal communications for ASOUD ERP"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
asoud_core = ">=0.15.0"
asoud_iran = ">=0.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
